services:
    db:
        container_name: postgres
        image: postgres:15.2
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - ${POSTGRES_PORT:-5432}:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - backend_network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        container_name: redis
        image: redis:6.2
        restart: always
        ports:
            - ${REDIS_PORT:-6379}:6379
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        networks:
            - backend_network
        healthcheck:
            test: ['CMD', 'redis-cli', '--raw', 'PING']
            interval: 10s
            timeout: 5s
            retries: 5

    api:
        container_name: nest_api
        build: ./
        restart: always
        ports:
            - ${APPLICATION_PORT:-4000}:${APPLICATION_PORT:-4000}
        env_file:
            - .env.prod
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - backend_network

volumes:
    postgres_data:
    redis_data:

networks:
    backend_network:
