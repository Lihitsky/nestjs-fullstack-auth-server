name: server-deploy

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build Docker image
              run: docker build -t arturlihitskiy/nest_api .
            - name: Publish Image to Docker Hub
              run: docker push arturlihitskiy/nest_api:latest

    deploy:
        needs: build
        runs-on: aws-runner
        steps:
            - name: Pull image from Docker Hub
              run: sudo docker pull arturlihitskiy/nest_api:latest
            - name: Delete old container
              run: sudo docker rm -f nest_api || true
            - name: Run new container
              run: sudo docker run -d --name nest_api -p 4000:4000 arturlihitskiy/nest_api:latest
